<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Expediente académico</title>
	<meta name="description" content="Expediente académico: calificaciones de pre-primaria, primaria y secundaria.">
	<link rel="icon" type="image/svg+xml" href="favicon.svg">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<header class="topbar reveal" style="--i: 0">
		<span class="topbar__marca">Expediente<span class="topbar__punto">.</span></span>
		<span class="topbar__matricula" id="matricula"></span>
	</header>

	<main>
		<section class="hero reveal" style="--i: 1">
			<p class="hero__kicker">Expediente académico</p>
			<h1 class="hero__titulo" id="institucion">…</h1>
			<p class="hero__lede" id="lede">Cargando expediente…</p>
		</section>

		<section class="stats reveal" style="--i: 2" aria-label="Cifras del expediente" id="stats" hidden></section>

		<noscript>
			<p class="aviso">Este expediente necesita JavaScript para leer los datos del archivo <code>qualifications.json</code>.</p>
		</noscript>

		<nav class="pestanas reveal" style="--i: 3" aria-label="Niveles educativos" id="pestanas" hidden></nav>

		<div id="contenido" hidden></div>

		<p class="aviso" id="error" hidden></p>
	</main>

	<footer class="pie reveal" style="--i: 4">
		<p>Expediente publicado con fines informativos.</p>
	</footer>

	<script src="app.js"></script>
</body>
</html>
